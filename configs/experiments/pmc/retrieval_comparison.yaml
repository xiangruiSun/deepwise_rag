# PMC-Patients, stage 3 — retrieval strategies. The dense branch uses BGE-base-v1.5, the best dense
# model of stage 1 on the validation queries (BM25 was best overall there).
# Cross-encoders see at most 512 tokens for the query summary and the candidate summary together,
# so both are heavily truncated; depth is 20 to keep CPU/GPU time reasonable.
# No laboratory, image or LLM-query-transformation runs: the dataset has no such data, and LLM
# rewriting applies to free-text queries, not to case queries.
suite_id: retrieval_comparison
description: PMC-Patients — lexical, dense, fused and reranked retrieval.
base_config: pmc_patients.yaml
stage: validation
baseline_experiment: R01
recipes:
  r_dense: {recipe_id: r_dense, branches: [dense], embedding: bge}
  r_rrf:
    recipe_id: r_rrf
    branches: [bm25, dense]
    embedding: bge
    fusion: {method: rrf, rrf_k: 60, weights: {bm25: 1.0, dense: 1.0}}
  r_weighted:
    recipe_id: r_weighted
    branches: [bm25, dense]
    embedding: bge
    fusion: {method: weighted_score, weights: {bm25: 0.5, dense: 0.5}, normalization: min_max}
  r_rrf_ce_general:
    recipe_id: r_rrf_ce_general
    branches: [bm25, dense]
    embedding: bge
    fused_top_k: 100
    reranker: {enabled: true, key: ms_marco_minilm, provider: cross_encoder, model_id: cross-encoder/ms-marco-MiniLM-L6-v2, depth: 20}
  r_rrf_ce_medcpt:
    recipe_id: r_rrf_ce_medcpt
    branches: [bm25, dense]
    embedding: bge
    fused_top_k: 100
    reranker: {enabled: true, key: medcpt_cross_encoder, provider: medcpt_cross_encoder, model_id: ncbi/MedCPT-Cross-Encoder, depth: 20}
runs:
  - {experiment_id: R01, recipe: bm25, description: BM25}
  - {experiment_id: R02, recipe: r_dense, description: Dense vectors (BGE)}
  - {experiment_id: R03, recipe: r_rrf, description: BM25 + dense with RRF}
  - {experiment_id: R04, recipe: r_weighted, description: BM25 + dense with normalized weighted fusion}
  - {experiment_id: R05, recipe: r_rrf_ce_general, description: RRF + general cross-encoder (depth 20)}
  - {experiment_id: R06, recipe: r_rrf_ce_medcpt, description: RRF + MedCPT cross-encoder (depth 20)}
