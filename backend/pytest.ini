[pytest]
testpaths = tests
markers =
    neural: needs PyTorch and locally cached model weights (skipped otherwise)
    elasticsearch: needs a reachable Elasticsearch node (skipped otherwise)
    spark: needs PySpark and a JVM (skipped otherwise)
    redis: needs a reachable Redis server (skipped otherwise)
    security: release-gate tests (tenant isolation, access control, prompt injection)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
