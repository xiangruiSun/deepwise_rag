[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspect-rag"
version = "0.1.0"
description = "Evaluation-driven multimodal clinical case retrieval (research prototype; not for clinical use)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "pydicom>=3.0",
    "elasticsearch>=8.13,<9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.41", "sentence-transformers>=3.0", "SimpleITK>=2.3"]
haystack = ["haystack-ai>=2.6"]
tracking = ["mlflow-skinny>=2.14"]
observability = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25",
                 "opentelemetry-exporter-otlp-proto-http>=1.25", "opentelemetry-instrumentation-fastapi>=0.46b0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
inspect-rag = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM108", "RUF001", "RUF002", "RUF003", "UP045", "UP007", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "E741", "RUF015", "B017", "SIM300"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
