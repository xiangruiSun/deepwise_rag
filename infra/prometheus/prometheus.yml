# Scrapes the API's /api/v1/metrics endpoint (Prometheus text format).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: inspect-rag-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8000"]
