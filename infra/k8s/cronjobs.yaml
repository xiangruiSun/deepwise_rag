apiVersion: batch/v1
kind: CronJob
metadata:
  name: corpus-scheduled-evaluation
  namespace: inspect-rag
spec:
  schedule: "0 4 * * *"   # nightly evaluation; exits 3 when a release gate fails
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 1000}
          containers:
            - name: task
              image: registry.example.com/inspect-rag-backend:REPLACE_WITH_IMAGE_TAG
              command: ["python", "-m", "app.cli", "corpus", "eval", "run", "--dataset", "/srv/eval/queries.jsonl", "--baseline", "hybrid", "--strategy", "hybrid", "--strategy", "hybrid_rerank"]
              envFrom: [{configMapRef: {name: inspect-rag-config}}]
              env:
                - name: INSPECT_RAG_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: inspect-rag-secrets, key: database-url}}
                - name: INSPECT_RAG_ELASTICSEARCH_API_KEY
                  valueFrom: {secretKeyRef: {name: inspect-rag-secrets, key: elasticsearch-api-key}}
              resources:
                requests: {cpu: "1", memory: 2Gi}
