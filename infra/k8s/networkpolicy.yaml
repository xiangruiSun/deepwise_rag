apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: inspect-rag
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: inspect-rag
spec:
  podSelector:
    matchLabels: {app: corpus-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-server-from-app
  namespace: inspect-rag
spec:
  podSelector:
    matchLabels: {app: vllm}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: corpus-api}}
        - podSelector: {matchLabels: {app: corpus-batch-worker}}
      ports: [{port: 8000}]
