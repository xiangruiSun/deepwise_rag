name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r backend/requirements-dev.lock
          pip install "haystack-ai>=2.6"
          pip install --no-deps -e backend
      - name: Lint and type-check
        working-directory: backend
        run: |
          ruff check app tests
          mypy app
      - name: Tests (hermetic, synthetic data, CPU-only)
        working-directory: backend
        run: pytest -m "not neural"

  corpus-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r backend/requirements-dev.lock
          pip install --no-deps -e backend
      - name: Security release gates (tenant isolation, access control, prompt injection)
        working-directory: backend
        run: pytest -m security -q
      - name: Deterministic end-to-end pipeline with evaluation gates
        working-directory: backend
        env:
          INSPECT_RAG_ARTIFACT_DIR: ${{ runner.temp }}/artifacts
          INSPECT_RAG_DATABASE_URL: sqlite:///${{ runner.temp }}/corpus.db
        run: |
          python -m app.cli corpus generate --records 2000 --golden 100 --output "$RUNNER_TEMP/corpus"
          python -m app.cli corpus ingest --source "$RUNNER_TEMP/corpus/raw"
          python -m app.cli corpus index build
          python -m app.cli corpus index check
          # exits 3 when a release gate (leakage, injection, errors) fails
          python -m app.cli corpus eval run --dataset "$RUNNER_TEMP/corpus/eval/queries.jsonl" \
            --strategy bm25 --strategy hybrid --strategy hybrid_rerank --baseline bm25
      - name: Validate deployment manifests
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose --profile platform --profile monitoring config --quiet
          python - <<'PY'
          import glob, json, yaml
          for path in glob.glob("infra/k8s/*.yaml") + glob.glob("infra/prometheus/*.yml"):
              list(yaml.safe_load_all(open(path)))
          json.load(open("infra/grafana/dashboards/corpus_platform.json"))
          PY
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t inspect-rag-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements.lock
          pip install --no-deps -e backend
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Prepare the synthetic cohort
        working-directory: backend
        run: |
          python -m app.cli generate-synthetic
          python -m app.cli ingest
          python -m app.cli reindex
          python -m app.cli run-experiment experiments/smoke.yaml
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
